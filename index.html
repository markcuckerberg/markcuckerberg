<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choices Matter — Story Template</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f0e17;
      --surface:     #1a1828;
      --surface2:    #252340;
      --accent:      #e8645a;
      --accent2:     #a78bfa;
      --text:        #fffffe;
      --muted:       #a7a9be;
      --border:      #2e2c4a;
      --radius:      12px;
      --transition:  0.25s ease;
      --max-width:   680px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: var(--max-width);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .story-title {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--accent2);
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      gap: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stat { display: flex; align-items: center; gap: 0.3em; }
    .stat span { color: var(--text); font-weight: bold; }

    /* ── Progress bar ─────────────────────────────────────────── */
    .progress-bar {
      width: 100%;
      max-width: var(--max-width);
      height: 4px;
      background: var(--surface2);
      border-radius: 99px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.6s ease;
      width: 0%;
    }

    /* ── Story card ───────────────────────────────────────────── */
    #story-card {
      width: 100%;
      max-width: var(--max-width);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Scene image / banner ─────────────────────────────────── */
    .scene-banner {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: background var(--transition);
    }

    /* ── Chapter label ────────────────────────────────────────── */
    .chapter-label {
      font-family: monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    /* ── Scene heading ────────────────────────────────────────── */
    .scene-heading {
      font-size: 1.55rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
      line-height: 1.25;
    }

    /* ── Narrative text ───────────────────────────────────────── */
    .scene-text {
      color: #d4d2e8;
      line-height: 1.8;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .scene-text p + p { margin-top: 0.9em; }

    /* ── Choices ──────────────────────────────────────────────── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .choice-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      padding: 1rem 1.2rem;
      text-align: left;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .choice-btn:hover {
      border-color: var(--accent2);
      background: #2a2848;
      transform: translateX(4px);
    }

    .choice-btn:active { transform: translateX(2px); }

    .choice-letter {
      flex-shrink: 0;
      width: 1.6em;
      height: 1.6em;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      margin-top: 1px;
    }

    /* Consequence badge colors */
    .choice-btn[data-tag="danger"]   .choice-letter { background: #ef4444; }
    .choice-btn[data-tag="clever"]   .choice-letter { background: #3b82f6; }
    .choice-btn[data-tag="kind"]     .choice-letter { background: #22c55e; }
    .choice-btn[data-tag="bold"]     .choice-letter { background: var(--accent); }

    .choice-text { flex: 1; line-height: 1.5; }
    .choice-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* ── Outcome / ending card ────────────────────────────────── */
    .outcome-box {
      border-left: 3px solid var(--accent2);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
      line-height: 1.7;
    }

    /* ── Restart / nav buttons ────────────────────────────────── */
    .action-row {
      margin-top: 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: bold;
      transition: opacity var(--transition), transform var(--transition);
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* ── History log ──────────────────────────────────────────── */
    #history-log {
      width: 100%;
      max-width: var(--max-width);
      margin-top: 2.5rem;
    }

    #history-log summary {
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 0;
      user-select: none;
    }

    .history-entries {
      margin-top: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .history-entry {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: baseline;
      gap: 0.6em;
    }

    .history-entry::before {
      content: '›';
      color: var(--accent2);
      flex-shrink: 0;
    }

    .history-choice { color: var(--text); }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      #story-card { padding: 1.6rem 1.2rem; }
      .scene-heading { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  STORY DATA — fill in your own content below               -->
<!-- ═══════════════════════════════════════════════════════════ -->
<!--
  QUICK REFERENCE
  ───────────────
  title       : Displayed in the header.
  stats       : Key/value pairs tracked across the whole story.
                Each choice can adjust them via statDeltas.
  scenes      : Object of scene objects, keyed by a unique id string.
                The engine always starts at the scene with id "start".

  SCENE FIELDS
  ────────────
  chapter     : Small label shown above the heading (e.g. "Chapter 1").
  icon        : Emoji shown in the scene banner.
  heading     : Bold scene title.
  text        : HTML string — wrap paragraphs in <p>...</p>.
  choices     : Array of choice objects (see below).
                Leave as [] for an ending scene.
  ending      : "good" | "mixed" | "bad"  — marks this scene as a terminal ending.
  endingNote  : Text shown in the coloured outcome box on ending scenes.

  CHOICE FIELDS
  ─────────────
  text        : The choice label shown on the button.
  hint        : (optional) Smaller sub-text beneath the label.
  tag         : "bold" | "clever" | "kind" | "danger" — colours the letter badge.
  goto        : id of the scene to navigate to when this choice is picked.
  statDeltas  : (optional) { statName: number } — adjusts stats on pick.
-->
<script>
window.STORY = {
  title: "Your Story Title",

  // ── Stats tracked across the story ──────────────────────────
  // Add, remove, or rename these as needed.
  stats: {
    // example_stat: 0,
  },

  // ── Scenes ──────────────────────────────────────────────────
  // The engine starts at the scene with id "start".
  scenes: {

    "start": {
      chapter: "Chapter 1",
      icon: "📖",
      heading: "Scene Heading",
      text: `<p>Your opening scene text goes here.</p>`,
      choices: [
        {
          text: "First choice",
          hint: "Optional hint text.",
          tag: "bold",
          goto: "scene_two"
          // statDeltas: { example_stat: 1 }
        },
        {
          text: "Second choice",
          hint: "Optional hint text.",
          tag: "clever",
          goto: "scene_three"
        }
      ]
    },

    "scene_two": {
      chapter: "Chapter 1",
      icon: "🔦",
      heading: "Scene Two Heading",
      text: `<p>Scene two text goes here.</p>`,
      choices: [
        {
          text: "Continue",
          tag: "kind",
          goto: "ending_good"
        }
      ]
    },

    "scene_three": {
      chapter: "Chapter 1",
      icon: "🌲",
      heading: "Scene Three Heading",
      text: `<p>Scene three text goes here.</p>`,
      choices: [
        {
          text: "Continue",
          tag: "danger",
          goto: "ending_bad"
        }
      ]
    },

    // ── Endings ─────────────────────────────────────────────────
    // ending: "good" | "mixed" | "bad"

    "ending_good": {
      chapter: "The End",
      icon: "✨",
      heading: "A Good Ending",
      text: `<p>Your good ending text goes here.</p>`,
      choices: [],
      ending: "good",
      endingNote: "Ending: Name — Brief description of this outcome."
    },

    "ending_bad": {
      chapter: "The End",
      icon: "💀",
      heading: "A Bad Ending",
      text: `<p>Your bad ending text goes here.</p>`,
      choices: [],
      ending: "bad",
      endingNote: "Ending: Name — Brief description of this outcome."
    }

  }
};
</script>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  HTML STRUCTURE                                             -->
<!-- ═══════════════════════════════════════════════════════════ -->

<header>
  <div class="story-title" id="story-title-el"></div>
  <div class="stats" id="stats-el"></div>
</header>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill"></div>
</div>

<div id="story-card"></div>

<details id="history-log">
  <summary>Choice history</summary>
  <div class="history-entries" id="history-entries"></div>
</details>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  ENGINE                                                     -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script>
(function () {
  const story    = window.STORY;
  const card     = document.getElementById('story-card');
  const statEl   = document.getElementById('stats-el');
  const titleEl  = document.getElementById('story-title-el');
  const progFill = document.getElementById('progress-fill');
  const histEl   = document.getElementById('history-entries');

  // ── State ────────────────────────────────────────────────────
  const state = {
    currentScene: 'start',
    stats: Object.assign({}, story.stats),
    history: [],
    visitedScenes: new Set()
  };

  const LETTER = ['A', 'B', 'C', 'D', 'E'];

  // Estimate total depth for progress (rough scene-count heuristic)
  const totalScenes = Object.keys(story.scenes).length;

  // ── Render helpers ───────────────────────────────────────────
  function updateHeader() {
    titleEl.textContent = story.title;
    statEl.innerHTML = Object.entries(state.stats)
      .map(([k, v]) => `<div class="stat">${k} <span>${v}</span></div>`)
      .join('');
  }

  function updateProgress() {
    const pct = Math.min(100, Math.round((state.visitedScenes.size / totalScenes) * 100));
    progFill.style.width = pct + '%';
  }

  function addHistory(sceneName, choiceText) {
    state.history.push({ scene: sceneName, choice: choiceText });
    const entry = document.createElement('div');
    entry.className = 'history-entry';
    entry.innerHTML = `<span class="history-scene">${sceneName.replace(/_/g,' ')}</span>
                       <span class="history-choice">→ ${choiceText}</span>`;
    histEl.appendChild(entry);
  }

  // ── Render a scene ───────────────────────────────────────────
  function renderScene(sceneId) {
    const scene = story.scenes[sceneId];
    if (!scene) { console.error('Unknown scene:', sceneId); return; }

    state.currentScene = sceneId;
    state.visitedScenes.add(sceneId);
    updateProgress();

    // Build choices HTML
    let choicesHTML = '';
    if (scene.choices && scene.choices.length > 0) {
      choicesHTML = `<div class="choices">` +
        scene.choices.map((c, i) => `
          <button class="choice-btn" data-tag="${c.tag || ''}" data-index="${i}">
            <span class="choice-letter">${LETTER[i]}</span>
            <span class="choice-text">
              ${c.text}
              ${c.hint ? `<div class="choice-hint">${c.hint}</div>` : ''}
            </span>
          </button>`).join('') +
        `</div>`;
    }

    // Ending state
    let endingHTML = '';
    if (scene.ending) {
      const palette = { good: '#22c55e', mixed: '#f59e0b', bad: '#ef4444' };
      const color = palette[scene.ending] || '#a78bfa';
      endingHTML = `
        <div class="outcome-box" style="border-color:${color}">
          ${scene.endingNote || 'The end.'}
        </div>
        <div class="action-row">
          <button class="btn btn-primary" id="restart-btn">Play Again</button>
        </div>`;
    }

    card.innerHTML = `
      <div class="scene-banner" id="scene-banner">${scene.icon || '📖'}</div>
      <div class="chapter-label">${scene.chapter || ''}</div>
      <h1 class="scene-heading">${scene.heading}</h1>
      <div class="scene-text">${scene.text}</div>
      ${choicesHTML}
      ${endingHTML}
    `;

    // ── Attach choice listeners ──────────────────────────────
    card.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx    = parseInt(btn.dataset.index, 10);
        const choice = scene.choices[idx];

        // Apply stat deltas
        if (choice.statDeltas) {
          Object.entries(choice.statDeltas).forEach(([k, v]) => {
            if (k in state.stats) state.stats[k] += v;
          });
        }

        // Increment generic choice counter
        if ('choices' in state.stats) state.stats.choices++;

        addHistory(sceneId, choice.text);
        updateHeader();
        renderScene(choice.goto);

        // Smooth scroll to top of card
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // Restart listener
    const restartBtn = document.getElementById('restart-btn');
    if (restartBtn) {
      restartBtn.addEventListener('click', () => {
        Object.assign(state.stats, story.stats);   // reset stats
        state.history = [];
        state.visitedScenes.clear();
        histEl.innerHTML = '';
        updateHeader();
        updateProgress();
        renderScene('start');
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }

  // ── Boot ────────────────────────────────────────────────────
  updateHeader();
  renderScene('start');
})();
</script>

</body>
</html>
