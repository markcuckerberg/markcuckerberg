<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choices Matter — Story Template</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f0e17;
      --surface:     #1a1828;
      --surface2:    #252340;
      --accent:      #e8645a;
      --accent2:     #a78bfa;
      --text:        #fffffe;
      --muted:       #a7a9be;
      --border:      #2e2c4a;
      --radius:      12px;
      --transition:  0.25s ease;
      --max-width:   680px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: var(--max-width);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .story-title {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--accent2);
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      gap: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stat { display: flex; align-items: center; gap: 0.3em; }
    .stat span { color: var(--text); font-weight: bold; }

    /* ── Progress bar ─────────────────────────────────────────── */
    .progress-bar {
      width: 100%;
      max-width: var(--max-width);
      height: 4px;
      background: var(--surface2);
      border-radius: 99px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.6s ease;
      width: 0%;
    }

    /* ── Story card ───────────────────────────────────────────── */
    #story-card {
      width: 100%;
      max-width: var(--max-width);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Scene image / banner ─────────────────────────────────── */
    .scene-banner {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: background var(--transition);
    }

    /* ── Chapter label ────────────────────────────────────────── */
    .chapter-label {
      font-family: monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    /* ── Scene heading ────────────────────────────────────────── */
    .scene-heading {
      font-size: 1.55rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
      line-height: 1.25;
    }

    /* ── Narrative text ───────────────────────────────────────── */
    .scene-text {
      color: #d4d2e8;
      line-height: 1.8;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .scene-text p + p { margin-top: 0.9em; }

    /* ── Choices ──────────────────────────────────────────────── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .choice-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      padding: 1rem 1.2rem;
      text-align: left;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .choice-btn:hover {
      border-color: var(--accent2);
      background: #2a2848;
      transform: translateX(4px);
    }

    .choice-btn:active { transform: translateX(2px); }

    .choice-letter {
      flex-shrink: 0;
      width: 1.6em;
      height: 1.6em;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      margin-top: 1px;
    }

    /* Consequence badge colors */
    .choice-btn[data-tag="danger"]   .choice-letter { background: #ef4444; }
    .choice-btn[data-tag="clever"]   .choice-letter { background: #3b82f6; }
    .choice-btn[data-tag="kind"]     .choice-letter { background: #22c55e; }
    .choice-btn[data-tag="bold"]     .choice-letter { background: var(--accent); }

    .choice-text { flex: 1; line-height: 1.5; }
    .choice-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* ── Outcome / ending card ────────────────────────────────── */
    .outcome-box {
      border-left: 3px solid var(--accent2);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
      line-height: 1.7;
    }

    /* ── Restart / nav buttons ────────────────────────────────── */
    .action-row {
      margin-top: 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: bold;
      transition: opacity var(--transition), transform var(--transition);
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* ── History log ──────────────────────────────────────────── */
    #history-log {
      width: 100%;
      max-width: var(--max-width);
      margin-top: 2.5rem;
    }

    #history-log summary {
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 0;
      user-select: none;
    }

    .history-entries {
      margin-top: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .history-entry {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: baseline;
      gap: 0.6em;
    }

    .history-entry::before {
      content: '›';
      color: var(--accent2);
      flex-shrink: 0;
    }

    .history-choice { color: var(--text); }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      #story-card { padding: 1.6rem 1.2rem; }
      .scene-heading { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<!--  STORY DATA — edit everything inside window.STORY          -->

<script>
window.STORY = {
  title: "The Forgotten Signal",

  // Global stats tracked across the story (name → starting value)
  stats: {
    courage:  0,
    trust:    0,
    choices:  0
  },

  // Each scene has: id, chapter, icon, heading, text, choices[]
  // Each choice has: text, hint (optional), tag, goto, statDeltas (optional)
  scenes: {

    // ── ACT 1 ────────────────────────────────────────────────────
    "start": {
      chapter: "Act I — Arrival",
      icon: "🌌",
      heading: "A Signal from the Dark",
      text: `<p>It's 2:17 AM when your radio crackles to life. Through the static comes a pattern—
             unmistakably deliberate. Three short, three long, three short. Repeated. Insistent.</p>
             <p>You're alone at the remote listening station, sixty miles from the nearest town.
             Your colleague Mara left hours ago. The signal is coming from Grid 7, a sector
             flagged as empty in every map you own.</p>`,
      choices: [
        {
          text: "Trace the signal immediately",
          hint: "Head out into the dark alone.",
          tag: "bold",
          goto: "trace_alone",
          statDeltas: { courage: 2 }
        },
        {
          text: "Call Mara before doing anything",
          hint: "Two heads are better than one.",
          tag: "kind",
          goto: "call_mara",
          statDeltas: { trust: 2 }
        },
        {
          text: "Log the signal and wait for dawn",
          hint: "Patience can be its own strategy.",
          tag: "clever",
          goto: "wait_dawn",
          statDeltas: { courage: -1 }
        }
      ]
    },

    "trace_alone": {
      chapter: "Act I — Arrival",
      icon: "🔦",
      heading: "Into Grid 7",
      text: `<p>You grab your torch and a handheld receiver. The forest swallows the path quickly.
             Pine needles muffle every sound except the steady beep guiding you deeper.</p>
             <p>After twenty minutes you find it: a weather-beaten emergency beacon, partly buried
             under a fallen oak. Beside it, a canvas bag. Inside the bag—a journal and a
             photograph of a woman you recognise from the missing-persons board at the station.</p>`,
      choices: [
        {
          text: "Take the journal back for analysis",
          hint: "Evidence is best handled carefully.",
          tag: "clever",
          goto: "journal_careful",
          statDeltas: { trust: 1 }
        },
        {
          text: "Read the journal right here, right now",
          hint: "Urgency over protocol.",
          tag: "bold",
          goto: "journal_now",
          statDeltas: { courage: 1 }
        }
      ]
    },

    "call_mara": {
      chapter: "Act I — Arrival",
      icon: "📡",
      heading: "Mara Picks Up",
      text: `<p>Her voice is groggy but alert the moment you describe the signal. "SOS on that
             frequency? That's the old ranger band. Nobody's used it in fifteen years."</p>
             <p>She promises to be there in forty minutes. But forty minutes feels like a
             very long time right now.</p>`,
      choices: [
        {
          text: "Wait for Mara — don't touch anything",
          hint: "Trust the plan.",
          tag: "kind",
          goto: "wait_mara",
          statDeltas: { trust: 2 }
        },
        {
          text: "Start a preliminary sweep of Grid 7 before she arrives",
          hint: "A head start can't hurt.",
          tag: "bold",
          goto: "trace_alone",
          statDeltas: { courage: 1 }
        }
      ]
    },

    "wait_dawn": {
      chapter: "Act I — Arrival",
      icon: "🌅",
      heading: "First Light",
      text: `<p>You log the signal with timestamps and fall into an uneasy sleep on the station couch.
             At 6:04 AM you wake to silence — the signal is gone. But your log shows it ran
             for exactly three hours and seventeen minutes.</p>
             <p>Mara arrives for her shift and sees your notes immediately. "This pattern," she says,
             pressing a finger to the page, "matches a distress protocol from a 2009 expedition
             that was never officially closed."</p>`,
      choices: [
        {
          text: "Research the 2009 expedition together",
          hint: "Knowledge is power.",
          tag: "clever",
          goto: "research_together",
          statDeltas: { trust: 2, courage: 1 }
        },
        {
          text: "Drive out to Grid 7 now — armed with the log",
          hint: "Evidence in hand, move fast.",
          tag: "bold",
          goto: "trace_alone",
          statDeltas: { courage: 2 }
        }
      ]
    },

    // ── ACT 2 ────────────────────────────────────────────────────
    "journal_careful": {
      chapter: "Act II — The Truth Unravels",
      icon: "📓",
      heading: "Back at the Station",
      text: `<p>Under the desk lamp the journal pages glow. The handwriting is cramped but legible:
             field notes, coordinates, a recurring name — <em>Elara</em>. The final entry
             reads: <em>"They found the cache. I've hidden the key where the signal dies."</em></p>
             <p>Mara arrives. When she sees the journal her face goes pale. "That's my sister's
             handwriting," she whispers.</p>`,
      choices: [
        {
          text: "Tell Mara everything you know",
          hint: "Full transparency, regardless of consequences.",
          tag: "kind",
          goto: "tell_mara",
          statDeltas: { trust: 3 }
        },
        {
          text: "Withhold the final entry — protect her until you know more",
          hint: "Kindness through concealment.",
          tag: "danger",
          goto: "withhold_entry",
          statDeltas: { trust: -1, courage: 1 }
        }
      ]
    },

    "journal_now": {
      chapter: "Act II — The Truth Unravels",
      icon: "🌲",
      heading: "Reading in the Dark",
      text: `<p>Your torchlight shakes as you turn the damp pages. The writer — someone named Elara —
             describes being followed. The final entry is dated three weeks ago: <em>"If you're
             reading this, trust no one from the Holloway group. Get the coordinates to someone
             outside."</em></p>
             <p>A branch snaps. You are not alone in Grid 7.</p>`,
      choices: [
        {
          text: "Hide and observe who's coming",
          hint: "Information before action.",
          tag: "clever",
          goto: "hide_observe",
          statDeltas: { courage: 1 }
        },
        {
          text: "Call out — demand to know who's there",
          hint: "Boldness can disarm.",
          tag: "bold",
          goto: "call_out",
          statDeltas: { courage: 2, trust: -1 }
        }
      ]
    },

    "wait_mara": {
      chapter: "Act II — The Truth Unravels",
      icon: "🚗",
      heading: "Mara Arrives",
      text: `<p>Her headlights sweep the clearing at 3:02 AM. You brief her in the car. Without
             hesitation she says: "Grid 7 is where my sister went missing."</p>
             <p>Together you hike to the source. The emergency beacon blinks steadily, half-buried
             under a fallen oak. Next to it: a canvas bag. A journal. A photo of Elara.</p>`,
      choices: [
        {
          text: "Let Mara lead — it's her sister",
          hint: "Respect her stake in this.",
          tag: "kind",
          goto: "tell_mara",
          statDeltas: { trust: 3 }
        },
        {
          text: "Secure the evidence before emotions take over",
          hint: "Stay professional.",
          tag: "clever",
          goto: "journal_careful",
          statDeltas: { courage: 1 }
        }
      ]
    },

    "research_together": {
      chapter: "Act II — The Truth Unravels",
      icon: "🗂️",
      heading: "The 2009 Expedition",
      text: `<p>Three hours of archived radio logs, permit applications, and a redacted government
             report paint a disturbing picture. A seven-person survey team. Grid 7.
             A discovery described only as "the cache." Four members never returned.
             The file was closed by a group called <em>Holloway Environmental Services</em>.</p>
             <p>Mara pulls up their current registration. "They're still active," she says quietly.
             "And their regional office is forty miles from here."</p>`,
      choices: [
        {
          text: "Go to Grid 7 armed with this context",
          hint: "You know the players now.",
          tag: "clever",
          goto: "journal_careful",
          statDeltas: { courage: 2, trust: 1 }
        },
        {
          text: "Report to the authorities first",
          hint: "This is bigger than the two of you.",
          tag: "kind",
          goto: "report_authorities",
          statDeltas: { trust: 2 }
        }
      ]
    },

    // ── ACT 3 ────────────────────────────────────────────────────
    "tell_mara": {
      chapter: "Act III — Resolution",
      icon: "🤝",
      heading: "The Truth Between Friends",
      text: `<p>Mara reads every page, jaw tight. She sets the journal down. "She's alive," she
             says. "The coordinates in the last entry—I know that place. It's the old forestry
             shelter, two kilometres north."</p>
             <p>You find Elara there at dawn: cold, dehydrated, but alive. She'd triggered the
             beacon manually, hoping someone at the station would hear it.</p>
             <p>The Holloway group's illegal extraction operation, documented in her field notes,
             is later investigated by federal authorities. Mara never stops thanking you
             for not keeping secrets.</p>`,
      choices: [],
      ending: "good",
      endingNote: "Ending: The Whole Truth — Elara is found. Holloway is exposed. Trust made the difference."
    },

    "withhold_entry": {
      chapter: "Act III — Resolution",
      icon: "🌫️",
      heading: "Half a Truth",
      text: `<p>You share most of what you know. Mara finds the shelter coordinates herself,
             eventually — but two days later than she might have. Elara survived, barely.</p>
             <p>When Mara discovers you withheld the final entry, she understands your intent.
             But understanding isn't the same as forgiveness, and your partnership
             at the station is never quite the same.</p>`,
      choices: [],
      ending: "mixed",
      endingNote: "Ending: Good Intentions — Elara survives, but a friendship is strained by a well-meaning secret."
    },

    "hide_observe": {
      chapter: "Act III — Resolution",
      icon: "👁️",
      heading: "Shadows and Patience",
      text: `<p>You kill your torch. Two figures move past without seeing you. You catch fragments:
             "—signal shouldn't have activated—" and "—find the journal before morning."</p>
             <p>You photograph them with your phone. Back at the station you cross-reference
             the faces with Holloway's staff directory. By morning, federal warrants are issued.</p>
             <p>Elara is found in the forestry shelter — she'd been waiting, hoping exactly
             this would happen.</p>`,
      choices: [],
      ending: "good",
      endingNote: "Ending: Eyes Open — Patience and observation cracked the case wide open."
    },

    "call_out": {
      chapter: "Act III — Resolution",
      icon: "⚡",
      heading: "Confrontation",
      text: `<p>Your voice cuts through the trees. The figures freeze — then run. You chase,
             trip, lose them. But they drop a radio. Its last transmission gives you their
             call sign, which Mara traces to a Holloway field team.</p>
             <p>Your boldness spooked them but also gave you a lead. Elara is found two days
             later, after an intensive search. She's okay. The Holloway group vanishes
             across the border before warrants can be issued.</p>`,
      choices: [],
      ending: "mixed",
      endingNote: "Ending: The Loud Approach — Elara is safe, but boldness let the guilty slip away."
    },

    "report_authorities": {
      chapter: "Act III — Resolution",
      icon: "🏛️",
      heading: "By the Book",
      text: `<p>The detective on duty listens carefully to your evidence. Within six hours a search
             party is deployed to Grid 7. Elara is airlifted out by noon.</p>
             <p>The formal investigation into Holloway takes eighteen months, but it sticks.
             Seven arrests. The cache — rare mineral deposits mapped illegally — is seized.</p>
             <p>You and Mara are cited as key witnesses. The signal, it turns out, saved more
             than one life.</p>`,
      choices: [],
      ending: "good",
      endingNote: "Ending: Due Process — Doing it by the book brought the best outcome for everyone."
    }
  }
};
</script>

<!--  ENGINE                                                     -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script>
(function () {
  const story    = window.STORY;
  const card     = document.getElementById('story-card');
  const statEl   = document.getElementById('stats-el');
  const titleEl  = document.getElementById('story-title-el');
  const progFill = document.getElementById('progress-fill');
  const histEl   = document.getElementById('history-entries');

  // ── State ────────────────────────────────────────────────────
  const state = {
    currentScene: 'start',
    stats: Object.assign({}, story.stats),
    history: [],
    visitedScenes: new Set()
  };

  const LETTER = ['A', 'B', 'C', 'D', 'E'];

  // Estimate total depth for progress (rough scene-count heuristic)
  const totalScenes = Object.keys(story.scenes).length;

  // ── Render helpers ───────────────────────────────────────────
  function updateHeader() {
    titleEl.textContent = story.title;
    statEl.innerHTML = Object.entries(state.stats)
      .map(([k, v]) => `<div class="stat">${k} <span>${v}</span></div>`)
      .join('');
  }

  function updateProgress() {
    const pct = Math.min(100, Math.round((state.visitedScenes.size / totalScenes) * 100));
    progFill.style.width = pct + '%';
  }

  function addHistory(sceneName, choiceText) {
    state.history.push({ scene: sceneName, choice: choiceText });
    const entry = document.createElement('div');
    entry.className = 'history-entry';
    entry.innerHTML = `<span class="history-scene">${sceneName.replace(/_/g,' ')}</span>
                       <span class="history-choice">→ ${choiceText}</span>`;
    histEl.appendChild(entry);
  }

  // ── Render a scene ───────────────────────────────────────────
  function renderScene(sceneId) {
    const scene = story.scenes[sceneId];
    if (!scene) { console.error('Unknown scene:', sceneId); return; }

    state.currentScene = sceneId;
    state.visitedScenes.add(sceneId);
    updateProgress();

    // Build choices HTML
    let choicesHTML = '';
    if (scene.choices && scene.choices.length > 0) {
      choicesHTML = `<div class="choices">` +
        scene.choices.map((c, i) => `
          <button class="choice-btn" data-tag="${c.tag || ''}" data-index="${i}">
            <span class="choice-letter">${LETTER[i]}</span>
            <span class="choice-text">
              ${c.text}
              ${c.hint ? `<div class="choice-hint">${c.hint}</div>` : ''}
            </span>
          </button>`).join('') +
        `</div>`;
    }

    // Ending state
    let endingHTML = '';
    if (scene.ending) {
      const palette = { good: '#22c55e', mixed: '#f59e0b', bad: '#ef4444' };
      const color = palette[scene.ending] || '#a78bfa';
      endingHTML = `
        <div class="outcome-box" style="border-color:${color}">
          ${scene.endingNote || 'The end.'}
        </div>
        <div class="action-row">
          <button class="btn btn-primary" id="restart-btn">Play Again</button>
        </div>`;
    }

    card.innerHTML = `
      <div class="scene-banner" id="scene-banner">${scene.icon || '📖'}</div>
      <div class="chapter-label">${scene.chapter || ''}</div>
      <h1 class="scene-heading">${scene.heading}</h1>
      <div class="scene-text">${scene.text}</div>
      ${choicesHTML}
      ${endingHTML}
    `;

    // ── Attach choice listeners ──────────────────────────────
    card.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx    = parseInt(btn.dataset.index, 10);
        const choice = scene.choices[idx];

        // Apply stat deltas
        if (choice.statDeltas) {
          Object.entries(choice.statDeltas).forEach(([k, v]) => {
            if (k in state.stats) state.stats[k] += v;
          });
        }

        // Increment generic choice counter
        if ('choices' in state.stats) state.stats.choices++;

        addHistory(sceneId, choice.text);
        updateHeader();
        renderScene(choice.goto);

        // Smooth scroll to top of card
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // Restart listener
    const restartBtn = document.getElementById('restart-btn');
    if (restartBtn) {
      restartBtn.addEventListener('click', () => {
        Object.assign(state.stats, story.stats);   // reset stats
        state.history = [];
        state.visitedScenes.clear();
        histEl.innerHTML = '';
        updateHeader();
        updateProgress();
        renderScene('start');
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }

  // ── Boot ────────────────────────────────────────────────────
  updateHeader();
  renderScene('start');
})();
</script>

</body>
</html>
